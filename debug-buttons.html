<!DOCTYPE html>
<html>
<head>
    <title>Debug Button Generation</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .note-item { 
            background: #f8f9fa; 
            border: 1px solid #3498db; 
            border-radius: 8px; 
            padding: 15px; 
            margin-bottom: 10px; 
        }
        .test-button { 
            background: #27ae60; 
            color: white; 
            padding: 10px 15px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 14px;
        }
        .debug-info {
            background: #fff3cd;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔍 Debug Button Generation</h1>
    
    <div id="notes-container"></div>
    
    <div id="debug-output"></div>
    
    <script>
        // Test data from the actual server response
        const realNotes = [
            {
                id: 'x-coredata://FA0EA356-82B6-4B65-9C74-F1528B2816BD/ICNote/p1100',
                title: 'List of courses for AI',
                content: 'AI course content...',
                folder: 'AI for product managers'
            },
            {
                id: 'x-coredata://FA0EA356-82B6-4B65-9C74-F1528B2816BD/ICNote/p719',
                title: 'Story :: Most proud',
                content: 'Story content...',
                folder: 'Amazon Feb 2022'
            },
            {
                id: 'x-coredata://FA0EA356-82B6-4B65-9C74-F1528B2816BD/ICNote/p90',
                title: 'Amazon Interview - Youtube',
                content: 'Interview content...',
                folder: 'Amazon'
            }
        ];
        
        // Debug function
        window.openNoteById = function(noteId, noteTitle) {
            const debugOutput = document.getElementById('debug-output');
            debugOutput.innerHTML += `
                <div class="debug-info">
                    <strong>🔍 Button Clicked:</strong><br>
                    ID: ${noteId}<br>
                    Title: ${noteTitle}<br>
                    ID Length: ${noteId ? noteId.length : 'null'}<br>
                    Timestamp: ${new Date().toLocaleTimeString()}
                </div>
            `;
            
            console.log('🔍 Button clicked:', { noteId, noteTitle });
            
            // Test the actual API call
            testAPICall(noteId, noteTitle);
        };
        
        async function testAPICall(noteId, noteTitle) {
            try {
                const response = await fetch('/api/open-note', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ noteId, noteTitle })
                });

                const data = await response.json();
                
                const debugOutput = document.getElementById('debug-output');
                debugOutput.innerHTML += `
                    <div class="debug-info" style="background: ${data.success ? '#d4edda' : '#f8d7da'};">
                        <strong>📡 API Response:</strong><br>
                        Success: ${data.success}<br>
                        Message: ${data.message || data.error}<br>
                        Method: ${data.method || 'N/A'}
                    </div>
                `;
                
            } catch (error) {
                const debugOutput = document.getElementById('debug-output');
                debugOutput.innerHTML += `
                    <div class="debug-info" style="background: #f8d7da;">
                        <strong>❌ API Error:</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        // Generate the HTML exactly like the main app
        const container = document.getElementById('notes-container');
        container.innerHTML = realNotes.map((note, index) => {
            // Show the exact HTML that will be generated
            const buttonHTML = `onclick="window.openNoteById('${note.id}', '${note.title.replace(/'/g, "\\'")}');"`;
            
            return `
                <div class="note-item">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-weight: bold; color: #2c3e50; margin-bottom: 5px;">
                                📱 "${note.title}"
                            </div>
                            <div style="color: #6c757d; font-size: 12px; margin-bottom: 8px;">
                                📁 ${note.folder} • Real Apple Note
                            </div>
                            <div style="color: #6c757d; font-size: 10px; margin-bottom: 8px; font-family: monospace;">
                                ID: ${note.id}
                            </div>
                            <div class="debug-info">
                                Generated onclick: ${buttonHTML}
                            </div>
                        </div>
                        <button class="test-button" ${buttonHTML}>
                            📱 Open Note ${index + 1}
                        </button>
                    </div>
                </div>
            `;
        }).join('');
        
        console.log('🔍 Debug page loaded. Click buttons to see what parameters are passed.');
    </script>
</body>
</html>
