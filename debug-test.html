<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
</head>
<body>
    <button onclick="testAnalysis()">Test Analysis</button>
    <div id="result"></div>
    
    <script>
        async function testAnalysis() {
            console.log('Button clicked!');
            document.getElementById('result').innerHTML = 'Testing...';
            
            try {
                console.log('Making API call...');
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Response received:', response.status);
                const data = await response.json();
                console.log('Data:', data);
                
                document.getElementById('result').innerHTML = `
                    <h3>Success!</h3>
                    <p>Total Notes: ${data.summary.totalNotes}</p>
                    <p>Duplicates: ${data.summary.duplicateGroups}</p>
                    <p>Junk Notes: ${data.summary.junkNotesFound}</p>
                `;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
