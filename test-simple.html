<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; }
        .button { 
            background: #27ae60; 
            color: white; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
        }
        .button:hover { background: #2ecc71; }
    </style>
</head>
<body>
    <h1>🧪 Simple Test Page</h1>
    <p>This is a test to see if JavaScript is working.</p>
    
    <button class="button" onclick="testClick()">🚀 Test Button</button>
    
    <div id="result" style="margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 8px; display: none;">
        <h3>✅ Success!</h3>
        <p>JavaScript is working correctly.</p>
    </div>

    <script>
        function testClick() {
            alert('Button clicked! JavaScript is working!');
            console.log('Test button clicked');
            document.getElementById('result').style.display = 'block';
        }
        
        console.log('JavaScript loaded successfully');
    </script>
</body>
</html>
